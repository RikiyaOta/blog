name: Production Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform Apply & Deploy to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Toolchain with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Terraform Init & Apply
        id: terraform
        working-directory: terraform
        run: |
          terraform init -backend-config="endpoint=https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          terraform apply -auto-approve -var="cloudflare_account_id=${CLOUDFLARE_ACCOUNT_ID}"
          D1_ID=$(terraform output -raw d1_database_id)
          KV_ID=$(terraform output -raw kv_namespace_id)
          echo "d1_id=${D1_ID}" >> $GITHUB_OUTPUT
          echo "kv_id=${KV_ID}" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Inject Terraform Resource IDs into wrangler.jsonc
        run: |
          node -e '
            import fs from "node:fs";
            const raw = fs.readFileSync("wrangler.jsonc", "utf8");
            let conf = JSON.parse(raw);
            if (conf.d1_databases?.[0]) conf.d1_databases[0].database_id = "${{ steps.terraform.outputs.d1_id }}";
            if (conf.kv_namespaces?.[0]) conf.kv_namespaces[0].id = "${{ steps.terraform.outputs.kv_id }}";
            fs.writeFileSync("wrangler.jsonc", JSON.stringify(conf, null, 2));
          '

      - name: Build Cloudflare SSR Production Bundle
        run: pnpm build
        env:
          CLOUDFLARE: "true"

      - name: Deploy to Cloudflare Workers via Wrangler
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
