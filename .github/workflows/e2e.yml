name: Scheduled E2E Tests

on:
  schedule:
    # 毎日 日本時間 朝9:00 (UTC 00:00) に定期実行
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Toolchain with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Verify GitHub Actions Pinned Hashes
        run: pinact run --verify

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Astro Content Types
        run: pnpm exec astro sync

      - name: Initialize Database and Apply Seed
        run: pnpm db:seed

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright E2E Tests
        run: pnpm test
